<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" width="520" height="700" role="img" aria-label="VITAS Soothing Cream Gel 100ml">
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#FFFFFF"/>
      <stop offset="0.78" stop-color="#F3EBE6"/>
      <stop offset="1" stop-color="#E4D9D2"/>
    </linearGradient>
  </defs>
  <ellipse cx="260" cy="676" rx="150" ry="16" fill="#17181A" opacity="0.1"/>

  <!-- crimped seal at the top -->
  <rect x="176" y="52" width="168" height="26" rx="4" fill="#F1E9E4" stroke="#E7E0D4" stroke-width="1.5"/>
  <g stroke="#E7E0D4" stroke-width="1.4">
    <path d="M190,56 v18"/>
    <path d="M204,56 v18"/>
    <path d="M218,56 v18"/>
    <path d="M232,56 v18"/>
    <path d="M246,56 v18"/>
    <path d="M260,56 v18"/>
    <path d="M274,56 v18"/>
    <path d="M288,56 v18"/>
    <path d="M302,56 v18"/>
    <path d="M316,56 v18"/>
    <path d="M330,56 v18"/>
  </g>

  <!-- body: shoulders at the top, widening to the cap -->
  <path d="M186,78 C186,140 150,190 148,300 L146,586 C146,600 158,608 176,608 L344,608
           C362,608 374,600 374,586 L372,300 C370,190 334,140 334,78 Z"
        fill="url(#tube)" stroke="#E7E0D4" stroke-width="1.5"/>

  <!-- flip cap -->
  <path d="M160,610 h200 c8,0 12,5 12,12 v34 c0,8 -6,14 -14,14 H162 c-8,0 -14,-6 -14,-14 v-34 c0,-7 4,-12 12,-12 Z"
        fill="#FBF7F5" stroke="#E7E0D4" stroke-width="1.5"/>
  <path d="M148,626 h224" stroke="#E7E0D4" stroke-width="1.2"/>

  <!-- print -->
  <circle cx="260" cy="150" r="21" fill="#F47920"/>
  <text x="260" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF">V</text>
  <text x="260" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.9" fill="#F47920">SOOTHING CREAM GEL</text>
  <text x="262" y="300" text-anchor="start" transform="rotate(90 262 300)" font-family="Helvetica, Arial, sans-serif" font-size="86" font-weight="300" letter-spacing="10" fill="#F47920">VITAS</text>
  <text x="260" y="566" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#F47920">MADE IN FRANCE</text>
  <text x="260" y="592" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#F47920" opacity="0.9">100ml</text>

  <!-- highlight -->
  <path d="M180,150 C176,260 174,420 176,560" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="16" stroke-linecap="round" fill="none"/>
</svg>
